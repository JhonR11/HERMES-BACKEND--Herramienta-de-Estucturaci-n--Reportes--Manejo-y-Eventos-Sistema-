services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-reportes_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-reportes_db}"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-app_user}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-reportes_db}
      UPLOAD_DIR: /uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/uploads

volumes:
  pgdata:
  uploads:
